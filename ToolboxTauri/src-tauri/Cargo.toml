[package]
name = "toolbox"
version = "0.1.0"
description = "Cross-platform Toolbox (Tauri port of the macOS utilities app)"
authors = ["Maulik Sompura"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff"] }
lopdf = "0.44"
rayon = "1"
heif-rs = "26.7"
webpx = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
