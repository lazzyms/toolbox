[package]
name = "toolbox"
version = "0.1.0"
description = "Cross-platform Toolbox (Tauri port of the macOS utilities app)"
authors = ["Maulik Sompura"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cfb = "0.7.3"
office-crypto = "0.3.0"
md-5 = "0.10"
quick-xml = "0.41.0"
sha1 = "0.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff"] }
lopdf = "0.44"
rayon = "1"
heif-rs = "26.7"
webpx = "0.4"
sha2 = "0.11"
tiff = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
