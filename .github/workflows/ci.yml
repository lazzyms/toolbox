name: CI

# Merging to main publishes a release straight to auto-updating clients, so a red
# main is not just untidy — it's a failed release. This is the gate before that.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      # Points only at ToolboxKit — the processing logic, where the invariants are.
      - name: Test
        run: swift test
