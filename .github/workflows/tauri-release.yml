name: Tauri Release

on:
  push:
    branches: [tauri-port]
  workflow_dispatch:
    inputs:
      version:
        description: Exact semver (blank bumps the latest tauri-v tag)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tauri-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT" ]]; then version="$INPUT"; else
            tag="$(git tag --list 'tauri-v[0-9]*' --sort=-v:refname | head -1)"
            current="${tag#tauri-v}"
            if [[ -z "$current" ]]; then version=0.1.3; else
              IFS=. read -r major minor patch <<< "$current"
              version="$major.$minor.$((patch + 1))"
            fi
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            name: macOS
            target: aarch64-apple-darwin
            artifact: macos-aarch64
          - os: windows-latest
            name: Windows x86_64
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
          - os: windows-11-arm
            name: Windows arm64
            target: aarch64-pc-windows-msvc
            artifact: windows-arm64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.value }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TOOLBOX_REQUIRE_QPDF: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Require updater key
        shell: bash
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with: {workspaces: ToolboxTauri/src-tauri}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ToolboxTauri/package-lock.json
      - run: npm ci
        working-directory: ToolboxTauri
      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: ToolboxTauri
      - name: Run UI automation
        run: npm run test:ui
        working-directory: ToolboxTauri
      - name: Install qpdf (macOS)
        if: runner.os == 'macOS'
        run: brew install qpdf poppler
      - name: Install qpdf and stage Windows resources
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ToolboxTauri
        run: |
          choco install qpdf -y
          $popplerVersion = '26.02.0-0'
          $popplerSha256 = '993e4a94376ed712fafc7058d724ea0b943d118bbd2305cd9ed55174eb85cda5'
          $popplerArchive = Join-Path $env:RUNNER_TEMP "poppler-$popplerVersion.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/oschwartz10612/poppler-windows/releases/download/v$popplerVersion/Release-$popplerVersion.zip" `
            -OutFile $popplerArchive
          if ((Get-FileHash $popplerArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $popplerSha256) {
            throw 'Poppler archive checksum did not match the pinned release'
          }
          $popplerExtract = Join-Path $env:RUNNER_TEMP "poppler-$popplerVersion"
          Expand-Archive -Path $popplerArchive -DestinationPath $popplerExtract -Force
          $pdftoppm = Get-ChildItem $popplerExtract -Recurse -Filter pdftoppm.exe | Select-Object -First 1
          if (-not $pdftoppm) { throw 'Could not locate pdftoppm.exe in the Poppler archive' }
          $env:PATH = "$($pdftoppm.DirectoryName);$env:PATH"
          $pdftoppm.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path src-tauri\resources | Out-Null
          $qpdf = Get-ChildItem "$env:ChocolateyInstall\lib\qpdf" -Recurse -Filter qpdf.exe | Select-Object -First 1
          Copy-Item $qpdf.FullName src-tauri\resources\qpdf.exe -Force
          Get-ChildItem $qpdf.DirectoryName -Filter *.dll | Copy-Item -Destination src-tauri\resources -Force
          Copy-Item $pdftoppm.FullName src-tauri\resources\pdftoppm.exe -Force
          Get-ChildItem $pdftoppm.DirectoryName -Filter *.dll | Copy-Item -Destination src-tauri\resources -Force
          @{version=$env:VERSION; bundle=@{resources=@('resources/*')}} | ConvertTo-Json -Compress | Out-File -Encoding ascii release-config.json
      - name: Write macOS version config
        if: runner.os == 'macOS'
        working-directory: ToolboxTauri
        run: printf '{"version":"%s"}\n' "$VERSION" > release-config.json
      - run: cargo test
        working-directory: ToolboxTauri/src-tauri
      - name: Run native E2E matrix
        run: npm run test:native:e2e
        working-directory: ToolboxTauri
      - name: Build macOS
        if: runner.os == 'macOS'
        working-directory: ToolboxTauri
        run: |
          npm run tauri build -- --target ${{ matrix.target }} --config release-config.json
          ./scripts/bundle-qpdf.sh "$(pwd)/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Toolbox.app"
          mkdir -p release-assets
          archive="$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -name '*.app.tar.gz' -print -quit)"
          cp "$archive" "release-assets/Toolbox-${{ matrix.artifact }}.app.tar.gz"
          cp "$archive.sig" "release-assets/Toolbox-${{ matrix.artifact }}.app.tar.gz.sig"
          dmg="$(pwd)/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/Toolbox_${VERSION}_aarch64.dmg"
          ./scripts/make-dmg.sh "$(pwd)/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Toolbox.app" "$dmg"
          cp "$dmg" "release-assets/Toolbox-$VERSION-macos.dmg"
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ToolboxTauri
        run: |
          npm run tauri build -- --target ${{ matrix.target }} --config release-config.json
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $installer = Get-ChildItem "src-tauri\target\${{ matrix.target }}\release\bundle\nsis" -Filter *.exe | Select-Object -First 1
          Copy-Item $installer.FullName "release-assets\Toolbox-${{ matrix.artifact }}-setup.exe"
          Copy-Item "$($installer.FullName).sig" "release-assets\Toolbox-${{ matrix.artifact }}-setup.exe.sig"
      - uses: actions/upload-artifact@v7
        with:
          name: toolbox-${{ matrix.artifact }}
          path: ToolboxTauri/release-assets/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.value }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: tauri-port, fetch-depth: 0}
      - uses: actions/download-artifact@v7
        with: {name: toolbox-macos-aarch64, path: release-assets}
      - uses: actions/download-artifact@v7
        with: {name: toolbox-windows-x86_64, path: release-assets}
      - uses: actions/download-artifact@v7
        with: {name: toolbox-windows-arm64, path: release-assets}
      - name: Create signed update manifest
        run: |
          set -euo pipefail
          jq -n --arg v "$VERSION" \
            --arg ms "$(cat release-assets/Toolbox-macos-aarch64.app.tar.gz.sig)" \
            --arg ws "$(cat release-assets/Toolbox-windows-x86_64-setup.exe.sig)" \
            --arg wa "$(cat release-assets/Toolbox-windows-arm64-setup.exe.sig)" \
            '{version:$v,notes:("Toolbox Tauri " + $v),platforms:{"darwin-aarch64":{url:("https://github.com/lazzyms/toolbox/releases/download/tauri-v"+$v+"/Toolbox-macos-aarch64.app.tar.gz"),signature:$ms},"windows-x86_64":{url:("https://github.com/lazzyms/toolbox/releases/download/tauri-v"+$v+"/Toolbox-windows-x86_64-setup.exe"),signature:$ws},"windows-aarch64":{url:("https://github.com/lazzyms/toolbox/releases/download/tauri-v"+$v+"/Toolbox-windows-arm64-setup.exe"),signature:$wa}}}' \
            > tauri-latest.json
          gh release create "tauri-v$VERSION" release-assets/* tauri-latest.json \
            --title "Toolbox Tauri $VERSION" --notes "Signed macOS and Windows installers."
      - name: Publish manifest through protected branch PR
        run: |
          set -euo pipefail
          branch="automation/tauri-manifest-${VERSION}-${GITHUB_RUN_ID}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch --create "$branch"
          git add tauri-latest.json
          git commit -m "Publish Tauri $VERSION update manifest [skip ci]"
          git push origin "HEAD:$branch"
          pr_url="$(gh pr create \
            --base tauri-port \
            --head "$branch" \
            --title "Publish Tauri $VERSION updater manifest" \
            --body "Publishes the signed updater manifest for Tauri $VERSION at the protected tauri-port endpoint.")"
          gh pr merge "$pr_url" --squash --auto \
            --subject "Publish Tauri $VERSION update manifest [skip ci]" \
            --body "Publishes the signed updater manifest for Tauri $VERSION."
