name: Tauri Build

on:
  push:
    branches:
      - main
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-build
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            name: macOS
            platform: macos
          - os: windows-latest
            name: Windows
            platform: windows
    runs-on: ${{ matrix.os }}
    env:
      TOOLBOX_REQUIRE_QPDF: '1'
      VITE_POSTHOG_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
      VITE_TOOLBOX_TARGET_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (macOS)
        if: runner.os == 'macOS'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ToolboxTauri/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ToolboxTauri/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: ToolboxTauri

      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: ToolboxTauri

      - name: Run UI automation
        run: npm run test:ui
        working-directory: ToolboxTauri

      - name: Run production tool-flag E2E
        if: matrix.platform == 'macos'
        run: npm run test:ui:flags
        working-directory: ToolboxTauri

      - name: Run analytics tests
        run: npm run test:analytics
        working-directory: ToolboxTauri

      - name: Install qpdf (macOS)
        if: runner.os == 'macOS'
        run: brew install qpdf poppler tesseract

      - name: Install qpdf (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install qpdf poppler tesseract -y
          $tesseractDirectory = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          if (-not (Test-Path (Join-Path $tesseractDirectory 'tesseract.exe'))) {
            throw 'Could not locate the installed Tesseract executable'
          }
          $tesseractDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Stage qpdf as Windows bundle resources
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ToolboxTauri
        run: |
          $popplerVersion = '26.02.0-0'
          $popplerSha256 = '993e4a94376ed712fafc7058d724ea0b943d118bbd2305cd9ed55174eb85cda5'
          $popplerArchive = Join-Path $env:RUNNER_TEMP "poppler-$popplerVersion.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/oschwartz10612/poppler-windows/releases/download/v$popplerVersion/Release-$popplerVersion.zip" `
            -OutFile $popplerArchive
          if ((Get-FileHash $popplerArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $popplerSha256) {
            throw 'Poppler archive checksum did not match the pinned release'
          }
          $popplerExtract = Join-Path $env:RUNNER_TEMP "poppler-$popplerVersion"
          Expand-Archive -Path $popplerArchive -DestinationPath $popplerExtract -Force
          $pdftoppm = Get-ChildItem $popplerExtract -Recurse -Filter pdftoppm.exe |
            Select-Object -First 1
          if (-not $pdftoppm) { throw 'Could not locate pdftoppm.exe in the Poppler archive' }
          $pdftotext = Get-ChildItem $popplerExtract -Recurse -Filter pdftotext.exe |
            Select-Object -First 1
          if (-not $pdftotext) { throw 'Could not locate pdftotext.exe in the Poppler archive' }
          $env:PATH = "$($pdftoppm.DirectoryName);$env:PATH"
          $pdftoppm.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path src-tauri\resources | Out-Null
          $qpdf = Get-ChildItem "$env:ChocolateyInstall\lib\qpdf" -Recurse -Filter qpdf.exe |
            Select-Object -First 1
          if (-not $qpdf) { throw 'Could not locate the real qpdf.exe in the Chocolatey package' }
          Write-Host "Staging $($qpdf.FullName)"
          Copy-Item $qpdf.FullName src-tauri\resources\qpdf.exe -Force
          Get-ChildItem $qpdf.DirectoryName -Filter *.dll |
            Copy-Item -Destination src-tauri\resources -Force
          Write-Host "Staging $($pdftoppm.FullName)"
          Copy-Item $pdftoppm.FullName src-tauri\resources\pdftoppm.exe -Force
          Get-ChildItem $pdftoppm.DirectoryName -Filter *.dll |
            Copy-Item -Destination src-tauri\resources -Force
          Write-Host "Staging $($pdftotext.FullName)"
          Copy-Item $pdftotext.FullName src-tauri\resources\pdftotext.exe -Force
          & src-tauri\resources\qpdf.exe --version
          '{"bundle": {"createUpdaterArtifacts": false, "resources": ["resources/*"]}}' |
            Out-File -Encoding ascii resources-qpdf.json

      - name: Run kit tests
        run: cargo test -- --test-threads=1
        working-directory: ToolboxTauri/src-tauri

      - name: Run native E2E matrix
        run: npm run test:native:e2e
        working-directory: ToolboxTauri

      - name: Stage offline vision adapter
        run: npm run stage:vision
        working-directory: ToolboxTauri

      - name: Stage offline OCR resources
        run: npm run stage:ocr
        working-directory: ToolboxTauri

      - name: Verify the tool matrix
        run: npm run check:matrix
        working-directory: ToolboxTauri

      - name: Write unsigned bundle config
        run: node -e "require('fs').writeFileSync('ci-config.json', JSON.stringify({bundle:{createUpdaterArtifacts:false}}))"
        working-directory: ToolboxTauri

      - name: Build unsigned macOS app
        if: runner.os == 'macOS'
        run: npm run tauri build -- --config ci-config.json
        working-directory: ToolboxTauri

      - name: Bundle qpdf into app (macOS)
        if: runner.os == 'macOS'
        working-directory: ToolboxTauri
        run: |
          ./scripts/bundle-qpdf.sh \
            "$(pwd)/src-tauri/target/release/bundle/macos/Toolbox.app"

      - name: Create macOS DMG from bundled app
        if: runner.os == 'macOS'
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          ./scripts/make-dmg.sh \
            "$(pwd)/src-tauri/target/release/bundle/macos/Toolbox.app" \
            "$(pwd)/src-tauri/target/release/bundle/dmg/Toolbox_${version}_aarch64.dmg"
        working-directory: ToolboxTauri

      - name: Verify bundled qpdf (macOS)
        if: runner.os == 'macOS'
        working-directory: ToolboxTauri
        run: |
          set -euo pipefail
          DMG="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          MOUNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG" >/dev/null
          APP="$MOUNT/Toolbox.app"
          test -x "$APP/Contents/Resources/qpdf-bin/qpdf"
          "$APP/Contents/Resources/qpdf-bin/qpdf" --version
          test -x "$APP/Contents/Resources/pdf-bin/pdftoppm"
          "$APP/Contents/Resources/pdf-bin/pdftoppm" -h >/dev/null
          codesign --verify --deep --strict "$APP"
          hdiutil detach "$MOUNT" >/dev/null

      - name: Build unsigned Windows bundles with qpdf resources
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ToolboxTauri
        run: npm run tauri build -- --config resources-qpdf.json

      - name: Verify bundled qpdf (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ToolboxTauri
        run: |
          $bundled = Get-ChildItem src-tauri\target\release -Recurse -Filter qpdf.exe |
            Select-Object -First 1
          if (-not $bundled) { throw 'qpdf.exe was not included in the Windows release tree' }
          & $bundled.FullName --version
          $pdftoppm = Get-ChildItem src-tauri\target\release -Recurse -Filter pdftoppm.exe |
            Select-Object -First 1
          if (-not $pdftoppm) { throw 'pdftoppm.exe was not included in the Windows release tree' }
          & $pdftoppm.FullName -h | Out-Null
          $pdftotext = Get-ChildItem src-tauri\target\release -Recurse -Filter pdftotext.exe |
            Select-Object -First 1
          if (-not $pdftotext) { throw 'pdftotext.exe was not included in the Windows release tree' }
          & $pdftotext.FullName -h | Out-Null
          if (-not (Get-ChildItem src-tauri\target\release\bundle\nsis -Filter *.exe)) {
            throw 'NSIS installer was not produced'
          }
          if (-not (Get-ChildItem src-tauri\target\release\bundle\msi -Filter *.msi)) {
            throw 'MSI installer was not produced'
          }

      - name: Prepare native desktop smoke evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP 'toolbox-desktop-smoke'
          New-Item -Path $evidenceDirectory -ItemType Directory -Force | Out-Null
          $reportPath = Join-Path $evidenceDirectory 'desktop-smoke-report.json'
          $report = [ordered]@{
            schemaVersion = 1
            platform = 'windows'
            executable = 'ToolboxTauri/src-tauri/target/debug/toolbox.exe'
            startedAt = [DateTime]::UtcNow.ToString('o')
            status = 'setup_pending'
            workspaces = @()
            setupError = $null
          }
          $report | ConvertTo-Json -Depth 5 | Set-Content -Path $reportPath -Encoding utf8

      - name: Build Windows WebDriver executable
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ToolboxTauri
        run: |
          $reportPath = Join-Path (Join-Path $env:RUNNER_TEMP 'toolbox-desktop-smoke') 'desktop-smoke-report.json'
          try {
            npm run tauri build -- --debug --no-bundle
            if ($LASTEXITCODE -ne 0) { throw "Debug app build failed with exit code $LASTEXITCODE" }
          } catch {
            $report = Get-Content -Raw -Path $reportPath | ConvertFrom-Json -AsHashtable
            $report.status = 'failed'
            $report.setupError = "Debug app build failed: $($_.Exception.Message)"
            $report.finishedAt = [DateTime]::UtcNow.ToString('o')
            $report | ConvertTo-Json -Depth 5 | Set-Content -Path $reportPath -Encoding utf8
            throw
          }

      - name: Install Windows WebDriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $reportPath = Join-Path (Join-Path $env:RUNNER_TEMP 'toolbox-desktop-smoke') 'desktop-smoke-report.json'
          try {
            cargo install tauri-driver --locked
            if ($LASTEXITCODE -ne 0) { throw "cargo install tauri-driver failed with exit code $LASTEXITCODE" }

            cargo install --git https://github.com/chippers/msedgedriver-tool
            if ($LASTEXITCODE -ne 0) { throw "cargo install msedgedriver-tool failed with exit code $LASTEXITCODE" }

            & "$HOME/.cargo/bin/msedgedriver-tool.exe"
            if ($LASTEXITCODE -ne 0) { throw "msedgedriver-tool failed with exit code $LASTEXITCODE" }
            $PWD.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } catch {
            $report = Get-Content -Raw -Path $reportPath | ConvertFrom-Json -AsHashtable
            $report.status = 'failed'
            $report.setupError = $_.Exception.Message
            $report.finishedAt = [DateTime]::UtcNow.ToString('o')
            $report | ConvertTo-Json -Depth 5 | Set-Content -Path $reportPath -Encoding utf8
            throw
          }

      - name: Run native Windows desktop smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $policyPath = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $appName = 'toolbox.exe'
          $policyExisted = Test-Path $policyPath
          $previousArguments = $null
          $hadPreviousArguments = $false
          if ($policyExisted) {
            $existingPolicy = Get-ItemProperty -Path $policyPath
            $hadPreviousArguments = $existingPolicy.PSObject.Properties.Name -contains $appName
            if ($hadPreviousArguments) {
              $previousArguments = $existingPolicy.$appName
            }
          }

          $smokeExitCode = 1
          try {
            New-Item -Path $policyPath -Force | Out-Null
            New-ItemProperty -Path $policyPath -Name $appName -Value '--remote-debugging-port=0' -PropertyType String -Force | Out-Null
            npm run test:desktop:smoke
            $smokeExitCode = $LASTEXITCODE
          } finally {
            if ($hadPreviousArguments) {
              New-ItemProperty -Path $policyPath -Name $appName -Value $previousArguments -PropertyType String -Force | Out-Null
            } else {
              Remove-ItemProperty -Path $policyPath -Name $appName -ErrorAction SilentlyContinue
            }
            if (-not $policyExisted) {
              Remove-Item -Path $policyPath -ErrorAction SilentlyContinue
            }
          }
          exit $smokeExitCode
        working-directory: ToolboxTauri

      - name: Inspect WebView2 debugging port
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $dataDirectory = Join-Path $env:RUNNER_TEMP 'toolbox-webview2-user-data'
          $portFiles = Get-ChildItem -Path $dataDirectory -Filter DevToolsActivePort -File -Recurse -ErrorAction SilentlyContinue
          if (-not $portFiles) {
            Write-Host "No DevToolsActivePort found under $dataDirectory"
          } else {
            foreach ($portFile in $portFiles) {
              Write-Host "Found DevToolsActivePort at $($portFile.FullName)"
              Get-Content -Raw -Path $portFile.FullName
            }
          }

      - name: Upload native desktop smoke evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: toolbox-windows-desktop-smoke
          path: ${{ runner.temp }}/toolbox-desktop-smoke/
          if-no-files-found: warn

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: toolbox-${{ matrix.name }}
          path: |
            ToolboxTauri/src-tauri/target/release/bundle/macos/*.app
            ToolboxTauri/src-tauri/target/release/bundle/dmg/*.dmg
            ToolboxTauri/src-tauri/target/release/bundle/nsis/*.exe
            ToolboxTauri/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Summarise
        run: |
          {
            echo "## Toolbox Tauri — ${{ matrix.name }}"
            echo "Kit tests pass; unsigned installers attached as artifacts."
            echo "Ad-hoc/unsigned: suitable for testing, not public distribution."
          } >> "$GITHUB_STEP_SUMMARY"
