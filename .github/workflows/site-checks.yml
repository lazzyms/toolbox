name: Site Checks

# Tauri Build and Tauri Release skip docs-only pushes, so the site's release
# and SEO tests run here instead. They need only Node, not the app toolchain.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tauri-latest.json'
  pull_request:
    paths:
      - 'docs/**'
      - 'tauri-latest.json'
      - 'ToolboxTauri/scripts/sync-site-release.mjs'
      - 'ToolboxTauri/tests/site-*.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site release and SEO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run site release and SEO tests
        run: npm run test:site-release
        working-directory: ToolboxTauri
